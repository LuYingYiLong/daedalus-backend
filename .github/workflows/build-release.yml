name: Build & Release Backend Binary

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag, for example v1.2.0"
        required: true
        type: string
      draft:
        description: "Create a draft release"
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Mark the release as a prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: backend-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Build Windows x64 SEA
    runs-on: windows-latest
    env:
      DAEDALUS_AUTHENTICODE_SIGNED: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Verify release version
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag_name }}" } else { "${{ github.ref_name }}" }
          $expectedVersion = $tag -replace '^v', ''
          $packageVersion = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($packageVersion -ne $expectedVersion) {
            throw "Tag $tag does not match package version $packageVersion."
          }

      - name: Test source runtime
        run: npm test

      - name: Build keytar for pinned Node
        run: npm run build:native:win

      - name: Build and smoke test SEA
        run: npm run build:sea:win

      - name: Verify release files
        shell: pwsh
        run: |
          $releaseDir = "dist/sea-win32-x64/release"
          $required = @(
            "daedalus-backend-win32-x64.zip",
            "daedalus-backend-win32-x64.json",
            "daedalus-backend-win32-x64.cdx.json",
            "SHA256SUMS.txt"
          )
          foreach ($name in $required) {
            $path = Join-Path $releaseDir $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing backend release asset: $name"
            }
          }
          $manifest = Get-Content -LiteralPath (Join-Path $releaseDir "daedalus-backend-win32-x64.json") -Raw | ConvertFrom-Json
          if ($manifest.platform -ne "win32" -or $manifest.arch -ne "x64") {
            throw "Unexpected backend manifest target."
          }
          if ($manifest.authenticode -ne "unsigned") {
            throw "Unsigned release workflow produced an unexpected Authenticode status."
          }
          $expectedBinary = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).daedalusBinary
          if (
            $manifest.protocolVersion -ne $expectedBinary.protocolVersion `
            -or $manifest.minBridgeProtocolVersion -ne $expectedBinary.minBridgeProtocolVersion `
            -or $manifest.maxBridgeProtocolVersion -ne $expectedBinary.maxBridgeProtocolVersion `
            -or $manifest.minStudioVersion -ne $expectedBinary.minStudioVersion
          ) {
            throw "Backend manifest compatibility metadata does not match package.json daedalusBinary."
          }
          Get-ChildItem -LiteralPath $releaseDir -File | Format-Table Name, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: daedalus-backend-win32-x64
          path: dist/sea-win32-x64/release/*
          if-no-files-found: error

  build-linux-x64:
    name: Build Linux x64 SEA
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap build-essential libsecret-1-dev pkg-config zip

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Verify release version
        run: |
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}"
          expected_version="${tag#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$package_version" != "$expected_version" ]; then
            echo "Tag $tag does not match package version $package_version."
            exit 1
          fi

      - name: Test source runtime
        run: npm test

      - name: Build keytar for pinned Node
        run: npm rebuild keytar --build-from-source

      - name: Build and smoke test SEA
        run: npm run build:sea:linux

      - name: Verify release files
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, statSync } from "node:fs";

          const releaseDir = "dist/sea-linux-x64/release";
          const required = [
            "daedalus-backend-linux-x64.zip",
            "daedalus-backend-linux-x64.json",
            "daedalus-backend-linux-x64.cdx.json",
            "SHA256SUMS.txt"
          ];
          for (const name of required) {
            const path = `${releaseDir}/${name}`;
            if (!statSync(path, { throwIfNoEntry: false })) {
              throw new Error(`Missing backend release asset: ${name}`);
            }
          }
          const manifest = JSON.parse(readFileSync(`${releaseDir}/daedalus-backend-linux-x64.json`, "utf8"));
          const packageJson = JSON.parse(readFileSync("package.json", "utf8"));
          if (manifest.platform !== "linux" || manifest.arch !== "x64") {
            throw new Error("Unexpected backend manifest target.");
          }
          if (manifest.authenticode !== "unsigned" || manifest.sandboxHelper !== null) {
            throw new Error("Linux backend manifest contains unexpected Windows metadata.");
          }
          const expectedBinary = packageJson.daedalusBinary;
          for (const key of ["protocolVersion", "minBridgeProtocolVersion", "maxBridgeProtocolVersion", "minStudioVersion"]) {
            if (manifest[key] !== expectedBinary[key]) {
              throw new Error(`Backend manifest compatibility metadata does not match package.json daedalusBinary: ${key}`);
            }
          }
          console.log(`Verified Linux release assets in ${releaseDir}`);
          NODE

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: daedalus-backend-linux-x64
          path: dist/sea-linux-x64/release/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-windows-x64
      - build-linux-x64

    steps:
      - name: Download Windows release assets
        uses: actions/download-artifact@v4
        with:
          name: daedalus-backend-win32-x64
          path: release-assets/win32

      - name: Download Linux release assets
        uses: actions/download-artifact@v4
        with:
          name: daedalus-backend-linux-x64
          path: release-assets/linux

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets/publish
          cp release-assets/win32/daedalus-backend-win32-x64.* release-assets/publish/
          cp release-assets/linux/daedalus-backend-linux-x64.* release-assets/publish/
          cp release-assets/win32/SHA256SUMS.txt release-assets/publish/SHA256SUMS-win32-x64.txt
          cp release-assets/linux/SHA256SUMS.txt release-assets/publish/SHA256SUMS-linux-x64.txt
          find release-assets/publish -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: Daedalus Backend ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          overwrite_files: true
          files: release-assets/publish/*
